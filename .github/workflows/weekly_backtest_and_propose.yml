# 週次バックテスト & Tier1パラメータ提案パイプライン
#
# 重要: このワークフローはPRを自動作成するが、自動マージは一切行わない。
# 実運用実績がまだ十分に蓄積していないため、意図的にTier1自動マージを
# 無効化している。改善が見つかった場合でも、必ず人間がPRの内容を確認し、
# 手動でマージすること。
#
# 対象パラメータはgrid_width と new_order_halt_deviation_jpy(案4: base_price
# 乖離ベースの新規発注停止)の2つ。前者はWalk-Forward検証で信頼性が実証済み。
# 後者は既にEMERGENCY_STOPで信頼している「base_price乖離」という単一指標のみを
# 使う設計のため自動探索対象に含めているが、実運用実績はまだ乏しい。
# レジームフィルタ(trend_window/threshold)等、過学習と判明したパラメータは
# 自動化対象に含めない。
#
# 事前準備:
#   リポジトリの Settings > Actions > General > Workflow permissions で
#   "Read and write permissions" を有効にしておくこと
#   (デフォルトはread-onlyで、PR作成に失敗する)

name: weekly-backtest-and-propose

on:
  schedule:
    - cron: "0 20 * * 0"  # 毎週日曜 20:00 UTC (日本時間 月曜 05:00頃)
  workflow_dispatch: {}    # 手動実行も可能にしておく(動作確認用)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (HardStopLossManagerを含む全テストが通ることを確認)
        run: pytest tests/ -v

  backtest-and-propose:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch recent historical data (bitbank Public API、認証不要)
        run: python3 -m src.data_fetch --pair xrp_jpy --days 14 --out data/weekly_trades.csv

      - name: Run grid_width & halt_deviation sweep and propose config change if warranted
        id: propose
        run: python3 -m src.propose_params --trades-csv data/weekly_trades.csv

      - name: Create Pull Request (Tier1候補、自動マージはしない)
        if: steps.propose.outputs.proposal_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PARAM_PROPOSAL_PAT }}
          commit-message: "chore(params): 週次バックテストによるgrid_width/halt_deviation調整提案"
          branch: auto/weekly-param-proposal
          delete-branch: true
          title: "[Tier1候補] パラメータ調整の提案（週次バックテスト自動生成）"
          body-path: PR_BODY.md
          labels: |
            tier1-candidate
            needs-human-review

      # ==========================================================================
      # 以下は将来の自動マージ機能の土台。現時点では無効化されている(意図的)。
      #
      # 有効化する前提条件:
      #   1. 実運用実績が十分に蓄積し、この提案ロジック自体への信頼が積み上がっていること
      #   2. GITHUB_TOKENでは、このPRに対して他のワークフロー(pull_requestトリガーのCI)が
      #      発火しない制約があるため、Fine-grained PAT(またはGitHub App)への切り替えが必要
      #   3. mainブランチ保護ルールで「testワークフローのステータスチェックを必須」に設定する
      #
      # 有効化手順:
      #   a. Fine-grained PATを発行する
      #      - このリポジトリのみに権限を限定する
      #      - スコープ: Contents(Read and write), Pull requests(Read and write) のみ
      #      - 有効期限を設定する(無期限は避ける。90日程度を推奨)
      #   b. リポジトリの Settings > Secrets and variables > Actions に
      #      PARAM_PROPOSAL_PAT という名前でSecretとして保存する
      #   c. 上の "Create Pull Request" ステップの token を
      #      ${{ secrets.GITHUB_TOKEN }} から ${{ secrets.PARAM_PROPOSAL_PAT }} に変更する
      #      (PATに切り替えないと、下のauto-mergeが有効化されても
      #       testワークフローが再発火せず、ステータスチェックが永久に揃わない)
      #   d. 以下のコメントアウトを解除する
      # ==========================================================================

      - name: Verify proposed values are within envelope (最終防衛ライン)
        if: steps.propose.outputs.proposal_needed == 'true'
        run: |
          python3 - << 'VERIFY_EOF'
          import sys
          from src.config import GRID_ENVELOPE

          w = GRID_ENVELOPE.grid_width_default_jpy
          h = GRID_ENVELOPE.new_order_halt_deviation_jpy

          ok = True
          if not (GRID_ENVELOPE.grid_width_min_jpy <= w <= GRID_ENVELOPE.grid_width_max_jpy):
              print(f"NG: grid_width_default_jpy={w} がenvelope範囲外です", file=sys.stderr)
              ok = False
          if not (GRID_ENVELOPE.new_order_halt_deviation_min_jpy <= h <= GRID_ENVELOPE.new_order_halt_deviation_max_jpy):
              print(f"NG: new_order_halt_deviation_jpy={h} がenvelope範囲外です", file=sys.stderr)
              ok = False

          if not ok:
              print("envelope範囲チェックに失敗したため、自動マージを中止します。", file=sys.stderr)
              sys.exit(1)
          print(f"OK: grid_width={w} (envelope {GRID_ENVELOPE.grid_width_min_jpy}-{GRID_ENVELOPE.grid_width_max_jpy}), "
                f"halt_deviation={h} (envelope {GRID_ENVELOPE.new_order_halt_deviation_min_jpy}-{GRID_ENVELOPE.new_order_halt_deviation_max_jpy})")
          VERIFY_EOF

      - name: Enable auto-merge (要PAT。有効化条件は上記コメント参照。envelope検証通過後のみ)
        if: steps.propose.outputs.proposal_needed == 'true'
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PARAM_PROPOSAL_PAT }}
